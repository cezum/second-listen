services:
  - type: web
    name: voice-agent
    runtime: python
    plan: free
    # Blueprint commands run from rootDir, which defaults to the repository
    # root; render.yaml lives in app/, so point the service at app/.
    rootDir: app
    buildCommand: 'true'
    startCommand: python deployment/browser/server.py
    envVars:
      # sync: false is what makes Render prompt for a value during Blueprint
      # creation. Everything below with a literal value is set for you and can
      # be changed afterwards under Environment on the service.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Remote live workspaces require a password. Share this only with invited
      # testers; it protects the token, ledger, notes, and company history.
      - key: APP_PASSWORD
        sync: false
      # Containers must listen on all interfaces to be reachable; the server
      # binds loopback unless HOST says otherwise (local runs stay private).
      - key: HOST
        value: 0.0.0.0
      # Which agents/<name>.jsonc the service publishes on boot.
      - key: AGENT
        value: second-listen
      # Paste an id from your .env here to serve that exact agent. Left empty,
      # the service publishes AGENT itself and reuses the agent of the same
      # name on later restarts.
      - key: AGENT_ID
        value: ''
      # All ledger, history, archive and cache files live below this path.
      # Attach a persistent disk or replace this with an external store before
      # treating the hosted workspace as durable.
      - key: DATA_DIR
        value: /var/data
      - key: REQUIRE_HTTPS
        value: '1'
