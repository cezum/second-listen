<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Listen - trial-first slide deck</title>
  <style>
    @page { size: 16in 9in; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #26221f; }
    main { display: grid; justify-content: center; gap: 24px; padding: 24px; }
    .slide { position: relative; width: min(1280px, calc(100vw - 48px)); aspect-ratio: 16 / 9; break-after: page; page-break-after: always; }
    .slide img { display: block; width: 100%; height: 100%; object-fit: contain; background: #f6f4ef; box-shadow: 0 8px 28px #0007; }
    .hotspot { position: absolute; inset: 0; }
    @media print {
      html, body, main { background: transparent; padding: 0; gap: 0; }
      .slide { width: 100vw; height: 100vh; }
      .slide img { box-shadow: none; }
    }
  </style>
</head>
<body>
<main aria-label="Second Listen slide deck">
  <div class="slide"><img src="assets/deck-01.png" alt="Second Listen cover"></div>
  <div class="slide"><img src="assets/deck-02.png" alt="The sentence no dashboard captures"></div>
  <div class="slide"><img src="assets/deck-03.png" alt="A short debrief becomes an operating record"></div>
  <div class="slide"><img src="assets/deck-04.png" alt="The follow-up a summary would miss"></div>
  <div class="slide"><img src="assets/deck-05.png" alt="Last week's actions reopen first"></div>
  <div class="slide"><img src="assets/deck-06.png" alt="Recording analysis path"></div>
  <div class="slide"><img src="assets/deck-07.png" alt="Demo video"><a class="hotspot" href="https://youtu.be/51TKhR5Vg48" aria-label="Watch the demo video"></a></div>
  <div class="slide"><img src="assets/deck-08.png" alt="AssemblyAI technology paths"></div>
  <div class="slide"><img src="assets/deck-09.png" alt="Business value and originality"></div>
  <div class="slide"><img src="assets/deck-10.png" alt="Try Second Listen"><a class="hotspot" href="https://second-listen-wcap.onrender.com/" aria-label="Open the live demo"></a></div>
</main>
</body>
</html>
